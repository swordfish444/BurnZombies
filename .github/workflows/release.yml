name: Release
# Pushing a version tag that matches install.sh (git tag v0.14.0 && git push origin v0.14.0)
# builds the universal app, signs it with the release certificate and publishes the GitHub
# release that install.sh downloads. The key is the RELEASE_SIGNING_IDENTITY secret of the
# "release" environment, which only v* tags can use; scripts/release-identity.sh github uploads it.
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref_name }}
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Tag matches install.sh
        run: |
          version="$(sed -n 's/^version="\(.*\)"$/\1/p' install.sh)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "::error::Tag $GITHUB_REF_NAME, but install.sh downloads v$version."; exit 1; }
      - name: Signing identity
        env:
          RELEASE_SIGNING_IDENTITY: ${{ secrets.RELEASE_SIGNING_IDENTITY }}
        run: scripts/release-identity.sh ci
      - name: Build, sign and package
        run: scripts/package-release.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A release already drafted on GitHub keeps its notes; otherwise the tag's message is used.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
          fi
