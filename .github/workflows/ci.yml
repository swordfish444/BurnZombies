name: macOS proof
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
permissions:
  contents: read
jobs:
  prove:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchain
        run: swift --version
      - name: Safety and native lifecycle checks
        run: scripts/test.sh --integration
      - name: Build local app bundle
        run: scripts/build-app.sh
      - name: MCP client protocol proof
        run: python3 scripts/test-mcp.py
      - name: Storage discovery through the production MCP bridge
        run: python3 scripts/test-disk-discovery.py
      - name: Five-harness configuration proof
        run: python3 scripts/test-harness-install.py
      - name: Portable lifecycle skill installation
        run: python3 scripts/test-lifecycle-install.py
      - name: Machine-wide setup and reviewer lifetime
        run: python3 scripts/test-machine-setup.py
      - name: Native Settings without opening a window
        run: .build/debug/BurnZombiesApp --settings-proof "$RUNNER_TEMP/bz-settings.png"
      - name: Native impact filters without opening a window
        run: .build/debug/BurnZombiesApp --impact-proof "$RUNNER_TEMP/bz-impact"
      - name: Compact menu states without opening a window
        run: .build/debug/BurnZombiesApp --mini-proof "$RUNNER_TEMP/bz-mini"
      - name: Installer proof
        run: |
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/BurnZombies-test.tar.gz" -C dist BurnZombies.app
          python3 scripts/test-install.py "$RUNNER_TEMP/BurnZombies-test.tar.gz"
