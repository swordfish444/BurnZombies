name: macOS proof
# The full suite, about 20 minutes on a hosted runner. It runs only when started by hand
# (Actions → macOS proof → Run workflow). Pull requests get the fast checks in checks.yml; the
# everyday check is scripts/test.sh. Releases are built on the maintainer's Mac, never here.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchain
        run: swift --version
      - name: Safety and native lifecycle checks
        run: scripts/test.sh --integration
      - name: Native large-descriptor worktree regression
        run: .build/debug/BurnProof --worktree-native
      - name: Bounded native worktree finding refresh
        run: .build/debug/BurnProof --worktree-refresh-native
      - name: Native worktree and recovery screens
        run: .build/debug/BurnZombiesApp --worktree-view-proof "$RUNNER_TEMP/bz-worktrees"
      - name: Atomic worktree pagination and selection
        run: .build/debug/BurnZombiesApp --worktree-inventory-proof
      - name: Large Findings window and visible notification controls
        run: .build/debug/BurnZombiesApp --findings-proof "$RUNNER_TEMP/bz-findings.png"
      - name: Observer timer survives read-only status traffic
        run: .build/debug/BurnZombiesApp --observer-schedule-proof
      - name: Transport with one cooperative worker
        run: LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 .build/debug/BurnProof --transport
      - name: App bundle from the debug build, for the installer proof
        run: scripts/build-app.sh --debug
      - name: MCP client protocol proof
        run: python3 scripts/test-mcp.py
      - name: Autopilot MCP tools over stdio against a private app endpoint
        run: python3 scripts/test-autopilot-mcp.py
      - name: Storage discovery through the production MCP bridge
        run: python3 scripts/test-disk-discovery.py
      - name: Five-harness configuration proof
        run: python3 scripts/test-harness-install.py
      - name: Portable lifecycle skill installation
        run: python3 scripts/test-lifecycle-install.py
      - name: Machine-wide setup and reviewer lifetime
        run: python3 scripts/test-machine-setup.py
      - name: Native Settings without opening a window
        run: .build/debug/BurnZombiesApp --settings-proof "$RUNNER_TEMP/bz-settings.png"
      - name: Permission banner clicks without opening System Settings
        run: .build/debug/BurnZombiesApp --access-banner-proof "$RUNNER_TEMP/bz-access-banner"
      - name: Autopilot policy, processes, old copies, junk folders, sweep and look-only
        run: |
          .build/debug/BurnProof --autopilot-policy
          .build/debug/BurnProof --autopilot-process
          .build/debug/BurnProof --autopilot-worktrees
          .build/debug/BurnProof --autopilot-disk
          .build/debug/BurnProof --autopilot-sweep
          .build/debug/BurnProof --autopilot-look-only
      - name: Teach BZ, Findings and Autopilot settings without opening a window
        run: .build/debug/BurnZombiesApp --autopilot-proof "$RUNNER_TEMP/bz-autopilot"
      - name: Native impact filters without opening a window
        run: .build/debug/BurnZombiesApp --impact-proof "$RUNNER_TEMP/bz-impact"
      - name: Compact menu states without opening a window
        run: .build/debug/BurnZombiesApp --mini-proof "$RUNNER_TEMP/bz-mini"
      - name: Hunt progress without opening a window
        run: .build/debug/BurnZombiesApp --hunt-proof "$RUNNER_TEMP/bz-hunt"
      - name: Hunt scene without opening a window
        run: .build/debug/BurnZombiesApp --hunt-scene-proof "$RUNNER_TEMP/bz-hunt-scene"
      - name: Installer proof
        run: |
          python3 scripts/test-install-control.py
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/BurnZombies-test.tar.gz" -C dist BurnZombies.app
          python3 scripts/test-install.py "$RUNNER_TEMP/BurnZombies-test.tar.gz"
