name: Quick checks
# Every pull request gets the checks that need no compiler, done in seconds. A hosted Mac takes
# minutes just to build, so building and the quick proofs run locally (scripts/test.sh), and the
# full suite is the manual "macOS proof" workflow.
on:
  pull_request:
concurrency:
  group: quick-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Scripts parse, versions agree, doc links resolve
        run: scripts/check.sh
